<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <!-- the app's light dither: a fine dot grid over the near-white surface -->
    <pattern id="dither" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#0c0c0f" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0b6e47"/>
      <stop offset="0.55" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16a34a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#16a34a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- light surface + dither texture -->
  <rect width="1200" height="630" fill="#fafafb"/>
  <rect width="1200" height="630" fill="url(#dither)"/>
  <!-- hairline frame, like the app's card borders -->
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#e4e4e7"/>

  <!-- TEXT ZONE (top) — high-contrast graphite ink, nothing crosses it -->
  <text x="90" y="118" fill="#585860" font-size="24" letter-spacing="8" font-weight="600">MMMXCIX QUANT</text>
  <text x="88" y="214" fill="#0c0c0f" font-size="76" font-weight="800" letter-spacing="-1">Quant tools, honestly.</text>
  <text x="90" y="286" fill="#3a3a44" font-size="31" font-weight="500">Backtesting · in-browser ML · pairs &amp; HRP · live world map</text>
  <text x="90" y="336" fill="#585860" font-size="24">Free · private · every metric shown against its baseline</text>

  <!-- CHART ZONE (bottom) — the rising equity curve sits BELOW the text -->
  <path d="M90,556 L200,536 L300,544 L400,500 L500,512 L600,470 L700,486 L800,430 L910,452 L1010,392 L1110,372 L90,556 L90,600 L1110,600 Z" fill="url(#fill)"/>
  <polyline fill="none" stroke="url(#line)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"
    points="90,556 200,536 300,544 400,500 500,512 600,470 700,486 800,430 910,452 1010,392 1110,372"/>
  <circle cx="1110" cy="372" r="7" fill="#16a34a"/>

  <text x="90" y="600" fill="#585860" font-size="23" letter-spacing="1" font-weight="500">quant.mmmxcix.com</text>
</svg>
