<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- MMMXCIX Quant — two ascending candlesticks in near-ink on a Pewter Blue
       tile (the brand accent). Frameless: the tile is the frame. Ink & Signal. -->
  <rect width="64" height="64" rx="14" fill="#5f7fa8"/>
  <!-- candle 1 (lower) -->
  <line x1="25" y1="25" x2="25" y2="48" stroke="#0b0d12" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="20" y="30" width="10" height="14" rx="2.5" fill="#0b0d12"/>
  <!-- candle 2 (higher) -->
  <line x1="39" y1="15" x2="39" y2="42" stroke="#0b0d12" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="34" y="20" width="10" height="18" rx="2.5" fill="#0b0d12"/>
</svg>
