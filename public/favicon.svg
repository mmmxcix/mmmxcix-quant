<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- MMMXCIX Quant — three ascending candles in the brand's "up" green ramp on
       the graphite surface (#18181a = the dark-theme accent surface). Matches
       the app's monochrome-graphite palette + green growth semantic. -->
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0b6e47"/>
      <stop offset="0.55" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#18181a"/>
  <!-- candle 1 (lowest) -->
  <line x1="16" y1="31" x2="16" y2="53" stroke="#0b6e47" stroke-width="3" stroke-linecap="round"/>
  <rect x="11" y="36" width="10" height="13" rx="2.5" fill="#0b6e47"/>
  <!-- candle 2 -->
  <line x1="32" y1="20" x2="32" y2="46" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
  <rect x="27" y="25" width="10" height="16" rx="2.5" fill="#16a34a"/>
  <!-- candle 3 (highest, brightest) -->
  <line x1="48" y1="9" x2="48" y2="38" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <rect x="43" y="14" width="10" height="18" rx="2.5" fill="url(#g)"/>
</svg>
