    <meta name="theme-color" content="#f3f4fa" />
    <script>
      // Apply the saved theme MODE before paint (default light) — no flash of
      // wrong theme. Mode may be "light" | "dark" | "system"; system resolves
      // via the OS preference. The signed-in account's preference is mirrored
      // into localStorage by the app, so it survives reloads on every device.
      try {
        var m = localStorage.getItem("theme") || "light";
        if (m === "system") m = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = m === "dark" ? "dark" : "light";
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    </script>
