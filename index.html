<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#f3f4fa" />
    <script>
      // Apply the saved theme MODE before paint (default light) — no flash of
      // wrong theme. Mode may be "light" | "dark" | "system"; system resolves
      // via the OS preference. The signed-in account's preference is mirrored
      // into localStorage by the app, so it survives reloads on every device.
      try {
        var m = localStorage.getItem("theme") || "light";
        if (m === "system") m = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = m === "dark" ? "dark" : "light";
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    </script>
    <title>MMMXCIX Quant</title>
    <meta name="description" content="Quant trading tools: backtesting, charts, market data and news." />
    <meta property="og:title" content="MMMXCIX Quant" />
    <meta property="og:description" content="Backtesting, charts, market data and news for quant traders." />
    <meta property="og:url" content="https://quant.mmmxcix.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
